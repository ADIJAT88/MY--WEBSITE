<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <meta name=""viewport" content="width=device-width,initial-scale=1.0">
  <title>Registration Form</title> 
</head>

<body>
      <h1>Account Registration Form</h1>

  <form class="form-container">
    <!-- first name, last name, dob, email, gender, tel number, address, ext contact info, account type, id card type, id number, password
    1. personal details, 2. account information -->
    
    <div class="personal-info-section">
      <input type="text" placeholder="First Name">
      <input type="text" placeholder="Last Name">
      <select>
        <option value="FEMALE">Female</option>
        <option value="MALE">Male</option>
      </select>
      <input type="number" placeholder="phone Number">
      <input type="date" placeholder="Date of birth">
      <textarea cols="60" rows="3" placeholder="Full Address"></textarea>
    </div>

    <div class="ext-contact-section">
      <input type="text" placeholder="First Name">
      <input type="text" placeholder="Last Name">
      <input type="number" placeholder="External Phone Number">
      <input type="email" placeholder="external email">
    </div>

    <div class="account-section">
      <label>Account Type</label>
      <select>
        <option value="1">Savings</option>
        <option value="2">Current</option>
        <option value="3">Domiciliary</option>
      </select>

      <label>ID Type</label>
      <select>
        <option value="1">Voter's Card</option>
        <option value="2">Driver's License</option>
        <option value="3">International passport</option>
        <option value="3">others</option>
      </select>

    </div>

    <div class="password-section">
      <input type="password" placeholder="password">
      <input type="password" placeholder="re-enter password">
    </div>

  </form>
  
</body>
</html>
</body>
